name: Scheduled Tenders Sync to Supabase

on:
  schedule:
    # Өдөр бүр автоматаар ажиллана (UTC 00:00)
    - cron: '0 0 * * *'
  # GitHub Actions UI-аас хүссэн үедээ гараар дарж ажиллуулах
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape tender.gov.mn and upsert to Supabase
        run: node scripts/sync-to-supabase.js 1 20
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
