<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Circle Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="70%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Outer Rim Glow -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>

    <!-- Dynamic Flowing Mane Gradient -->
    <linearGradient id="maneGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#0EA5E9" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Cyan Highlight Mane -->
    <linearGradient id="cyanManeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Sleek Horse Head Gradient -->
    <linearGradient id="horseHeadGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Document Fill Gradient -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>

    <!-- Magnifier Glass Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Flowing Mongolian Horse Outer Mane (Left crescent wave) -->
  <path d="M 256 36 C 140 40 54 130 50 250 C 46 340 106 426 190 460 C 130 430 90 366 94 290 C 98 200 160 120 256 86 Z" fill="url(#maneGrad)" />

  <!-- Secondary Dynamic Cyan Crest Waves -->
  <path d="M 210 60 C 130 110 84 190 84 280 C 84 340 114 394 160 430 C 120 380 110 320 120 260 C 136 170 200 100 290 68 C 260 62 234 60 210 60 Z" fill="url(#cyanManeGrad)" opacity="0.9" />

  <!-- Upper Mane Crest Sweeping over Head -->
  <path d="M 270 54 C 330 68 376 110 398 160 C 374 136 340 118 300 112 C 340 126 366 150 376 186 C 354 166 324 154 286 154 C 316 166 334 186 340 214 C 310 196 270 190 234 198 C 264 164 280 114 270 54 Z" fill="url(#cyanManeGrad)" />

  <!-- The Proud White Mongolian Horse Head (Hiimori) -->
  <path d="M 344 116 C 352 144 344 170 338 186 C 362 196 394 230 406 280 C 412 304 404 330 384 336 C 370 340 360 330 354 316 C 348 296 342 278 334 266 C 322 286 318 330 332 374 C 342 404 360 428 350 446 C 342 458 322 458 304 446 C 274 426 256 384 256 334 C 256 264 290 194 334 134 C 340 124 342 118 344 116 Z" fill="url(#horseHeadGrad)" />

  <!-- Horse Eye (Sharp dynamic almond slit) -->
  <path d="M 334 212 C 346 220 360 234 366 250 C 354 246 342 238 334 228 Z" fill="#0F172A" />

  <!-- Flowing Neck Undercurve Shadow -->
  <path d="M 276 340 C 274 380 292 414 318 438 C 294 426 278 398 274 366 C 270 340 272 316 276 296 Z" fill="#94A3B8" opacity="0.6" />

  <!-- Procurement Document (Tender Specifications) -->
  <rect x="146" y="210" width="130" height="170" rx="14" fill="url(#docGrad)" stroke="#38BDF8" stroke-width="7" />
  <!-- Folded Corner of Document -->
  <path d="M 246 210 L 276 240 L 246 240 Z" fill="#0EA5E9" />
  <path d="M 246 210 L 276 240 L 246 240 Z" stroke="#38BDF8" stroke-width="4" stroke-linejoin="round" />

  <!-- Document Text Specification Lines -->
  <line x1="172" y1="262" x2="228" y2="262" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
  <line x1="172" y1="288" x2="248" y2="288" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />
  <line x1="172" y1="314" x2="216" y2="314" stroke="#94A3B8" stroke-width="6" stroke-linecap="round" />

  <!-- Analytics / Search Magnifying Glass (Market Intelligence & Search) -->
  <circle cx="254" cy="336" r="48" fill="#0B1329" stroke="#38BDF8" stroke-width="9" />
  <circle cx="254" cy="336" r="41" fill="none" stroke="#0284C7" stroke-width="3" opacity="0.6" />
  
  <!-- Magnifier Handle -->
  <line x1="218" y1="372" x2="174" y2="416" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" />
  <line x1="214" y1="376" x2="180" y2="410" stroke="#67E8F9" stroke-width="4" stroke-linecap="round" />

  <!-- Intelligence Data Chart Bars inside Search Glass -->
  <line x1="234" y1="322" x2="274" y2="322" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" />
  <line x1="230" y1="336" x2="278" y2="336" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" />
  <line x1="238" y1="350" x2="270" y2="350" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" />
</svg>
